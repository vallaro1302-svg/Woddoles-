name: Build WODDOLES ISO

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espaço em disco
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Gerar ISO (dentro de um Debian 12)
        run: |
          docker run --rm --privileged \
            -e DEBIAN_FRONTEND=noninteractive \
            -e HOST_UID=$(id -u) -e HOST_GID=$(id -g) \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            debian:bookworm bash -c '
              set -x
              apt-get update
              apt-get install -y sudo ca-certificates live-build
              DIR=$(dirname "$(find . -name build.sh -not -path "./.git/*" | head -n1)")
              cd "$DIR"
              chmod +x build.sh config/hooks/normal/*.hook.chroot
              ./build.sh
              RC=$?
              mkdir -p /work/out
              cp build/*.iso /work/out/ 2>/dev/null
              cp build.log /work/out/ 2>/dev/null
              chown -R $HOST_UID:$HOST_GID /work
              exit $RC
            '

      - name: Enviar resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woddoles-iso
          path: out/
          if-no-files-found: warn
